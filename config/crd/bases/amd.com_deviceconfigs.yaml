    singular: deviceconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DeviceConfig describes how to enable AMD GPU device
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DeviceConfigSpec describes how the AMD GPU operator should
              enable AMD GPU device for customer's use.
            properties:
              blacklistDrivers:
                description: blacklist amdgpu drivers on the host
                type: boolean
              devicePluginImage:
                description: device plugin image
                type: string
              driversImage:
                description: defines image that includes drivers and firmware blobs,
                  don't include tag since it will be fully managed by operator for
                  vanilla k8s the default value is image-registry:5000/$MOD_NAMESPACE/amdgpu_kmod
                  for OpenShift the default value is image-registry.openshift-image-registry.svc:5000/$MOD_NAMESPACE/amdgpu_kmod
                  image tag will be in the format of <linux distro>-<release version>-<kernel
                  version>-<driver version> example tag is coreos-416.94-5.14.0-427.28.1.el9_4.x86_64-el9-6.1.1
                  and ubuntu-22.04-5.15.0-94-generic-6.1.3
                type: string
              driversVersion:
                description: 'version of the drivers source code, can be used as part
                  of image of dockerfile source image default value for different
                  OS is: ubuntu: 6.1.3, coreOS: el9-6.1.1'
                type: string
              imageRepoSecret:
                description: pull secrets used for pull/push images from/to private
                  registry specified in driversImage
                properties:
                  name:
                    description: 'Name of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      TODO: Add other useful fields. apiVersion, kind, uid?'
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              imageSignCertSecret:
                description: ImageSignCertSecret the public key used to sign kernel
                  modules within image necessary for secire boot enabled system
                properties:
                  name:
                    description: 'Name of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      TODO: Add other useful fields. apiVersion, kind, uid?'
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              imageSignKeySecret:
                description: ImageSignKeySecret the private key used to sign kernel
                  modules within image necessary for secire boot enabled system
                properties:
                  name:
                    description: 'Name of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      TODO: Add other useful fields. apiVersion, kind, uid?'
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              metricsExporter:
                description: metrics exporter
                properties:
                  config:
                    description: optional configuration for metrics
                    properties:
                      name:
                        description: Name of the configMap that defines the list of
                          metrics default list:[]
                        type: string
                    type: object
                  enable:
                    description: enable metrics exporter, disabled by default
                    type: boolean
                  image:
                    description: metrics exporter image
                    type: string
                  nodePort:
                    description: metrics tcp port in the range 30000-32767, assigned
                      automatically by default
                    format: int32
                    type: integer
                  selector:
                    additionalProperties:
                      type: string
                    description: Selector describes on which nodes to enable metrics
                      exporter
                    type: object
                  serviceType:
                    description: ServiceType service type for metrics, clusterIP/NodePort,
