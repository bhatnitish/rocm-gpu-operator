---
version: 2.0
meta:


image:
  bind_dir: "/gpu-operator"
  work_dir: "/gpu-operator"
  

e2e-targets:
  gpu-operator-pytest-v1.0.0:
    commands: [
        "/bin/sh",
        "-c",
        "cat /warmd.json && cd /usr/src/github.com/pensando/gpu-operator/tests/pytests && \
         wget http://pm.test.pensando.io/systest/gpu-operator-secrets/secrets.json && \
         /usr/src/github.com/pensando/gpu-operator/ci-internal/k8_jobd_ctl.py testbed --testbed /warmd.json --reboot-workers --fetch-kube-config && \
         ./k8_test_launcher.sh --image-manifest image-manifest/release_v1.0.0_internal_images.yaml --secrets $PWD/secrets.json"
    ]
    owners: ["email:srivatsa.sangli@amd.com"]
    area:
    sub-area:
    resources:
    - generic:
      - type: K8-GPU-Node
        name: AMD-GPU-MI200
        vendor: Pensando
        count: 1

