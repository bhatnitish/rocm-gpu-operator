---
version: 2.0
meta:


image:
  bind_dir: "/gpu-operator"
  work_dir: "/gpu-operator"
  

e2e-targets:
  gpu-operator-pytest-sanity-devcfg-driver:
    commands: [
        "/bin/sh",
        "-c",
        "cat /warmd.json && cd /gpu-operator/tests/pytests && \
         /gpu-operator/ci-internal/run_sanity.sh --app gpu-operator --type sanity --registry local --testbed /warmd.json --amdgpu-driver deviceconfig"
    ]
    owners: ["email:srivatsa.sangli@amd.com"]
    tcp-ports: [5000]
    area:
    sub-area:
    build-dependencies:
      - build-gpu-operator
      - build-gpu-operator-k8s
      - build-external-device-metrics-exporter
      - build-external-test-runner
      - build-external-test-runner-agfhc
      - build-external-kernel-module-manager
      - build-external-kernel-module-signimage
      - build-external-kernel-module-webhook-server
      - build-external-kernel-module-worker
      - build-external-config-manager
    resources:
    - generic:
      - type: K8-GPU-Node
        vendor: Pensando
        count: 1
        props:
          - name: driver
            value: devcfg

  gpu-operator-pytest-sanity-devcfg-inbox:
    commands: [
        "/bin/sh",
        "-c",
        "cat /warmd.json && cd /gpu-operator/tests/pytests && \
         /gpu-operator/ci-internal/run_sanity.sh --app gpu-operator --type sanity --registry local --testbed /warmd.json --amdgpu-driver inbox"
    ]
    owners: ["email:srivatsa.sangli@amd.com"]
    tcp-ports: [5000]
    area:
    sub-area:
    build-dependencies:
      - build-gpu-operator
      - build-gpu-operator-k8s
      - build-external-device-metrics-exporter
      - build-external-test-runner
      - build-external-test-runner-agfhc
      - build-external-kernel-module-manager
      - build-external-kernel-module-signimage
      - build-external-kernel-module-webhook-server
      - build-external-kernel-module-worker
      - build-external-config-manager
    resources:
    - generic:
      - type: K8-GPU-Node
        vendor: Pensando
        count: 1
        props:
          - name: driver
            value: inbox

logfiles:
  - /gpu-operator/tests/pytests/pytest_logs.tgz
