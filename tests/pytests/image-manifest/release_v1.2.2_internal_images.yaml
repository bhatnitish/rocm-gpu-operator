            location    : container://registry.test.pensando.io:5000/rocm/kernel-module-management-worker
            version     : v1.2.2
            kind        : container

        kmm-controller-manager:
            key         : kmm.controller.manager.image
            location    : container://registry.test.pensando.io:5000/rocm/kernel-module-management-operator
            version     : v1.2.2
            kind        : container

        kmm-webhook-server:
            key         : kmm.webhookServer.webhookServer.image
            location    : container://registry.test.pensando.io:5000/rocm/kernel-module-management-webhook-server
            version     : v1.2.2
            kind        : container

    openshift:
        driver:
            1ag         : driver.image
            location    : container://registry.test.pensando.io:5000/amdgpu_kmod
            kind        : container

        gpu-operator:
            location    : http://assets-hq.pensando.io/builds/hourly-gpu-operator/v1.2.0-20/gpu-operator-helm-openshift-v1.2.0-v1.2.0-20.tgz
            build       : v1.2.0-20
            version     : v1.2.0
            kind        : helm-chart

        device-metrics-exporter:
            key         : metricsExporter.image
            location    : container://registry.test.pensando.io:5000/device-metrics-exporter/exporter:v1.2.0
            build       : v1.2.0-6
            version     : v1.2.0
            kind        : container

        test-runner:
            key         : testRunner.image
            location    : container://registry.test.pensando.io:5000/test-runner/test-runner:v1.2.0
            build       : v1.2.0-6
            version     : v1.2.0
            kind        : container
        
        device-plugin:
            key         : devicePlugin.devicePluginImage
            location    : container://registry.test.pensando.io:5000/k8s-device-plugin/deviceplugin:v2
            version     : v1.2.0
            kind        : container

        node-labeller:
            key         : devicePlugin.nodeLabellerImage
            location    : container://registry.test.pensando.io:5000/internal-k8s-nodelabeller:v1.2.0.beta
            version     : v1.2.0
            kind        : container

        kmm-controller-manager-image-sign:
            key         : kmm.controller.manager.env.relatedImageSign
