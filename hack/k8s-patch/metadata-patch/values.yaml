node-feature-discovery:
  enabled: true  # Set to false to disable node-feature-discovery
kmm:
  enabled: true  # Set to false to disable kmm
installdefaultNFDRule: true # default NFD rule will detect amd gpu based on pci vendor ID
platform: k8s # platform could be k8s or openshift
openshift:
  # if platform is openshift, nfd is already installed and user skipped install nfd with helm
  # they need to provide nfd worker's service account name to configure security context constraint
  # default service account name is nfd-worker if user install by nfd official repo
  nfd-worker-sa: nfd-worker
  # if platform is openshift, nfd is already installed and user skipped install nfd with helm
  # they need to provide nfd namespace to configure security context constraint
  # default namespace is node-feature-discovery if user install by nfd official repo
  nfd-namespace: node-feature-discovery
controllerManager:
  manager:
    args:
    - --config=controller_manager_config.yaml
    containerSecurityContext:
      allowPrivilegeEscalation: false
    image:
      repository: yan1996/amd-gpu-operator
      tag: dev
    imagePullPolicy: Always
    resources:
      limits:
        cpu: 500m
        memory: 384Mi
      requests:
        cpu: 10m
        memory: 64Mi
  replicas: 1
  serviceAccount:
    annotations: {}
kmmDevicePlugin:
  serviceAccount:
    annotations: {}
kmmModuleLoader:
  serviceAccount:
    annotations: {}
kubernetesClusterDomain: cluster.local
managerConfig:
  controllerManagerConfigYaml: |-
    healthProbeBindAddress: :8081
    metricsBindAddress: 127.0.0.1:8080
    leaderElection:
      enabled: true
      resourceID: gpu.amd.com
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: https
  type: ClusterIP
nodeLabeller:
  serviceAccount:
    annotations: {}
