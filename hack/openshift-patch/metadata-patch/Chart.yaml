apiVersion: v2
name: gpu-operator
description: A Helm chart for deploying Kubernetes AMD GPU Operator
type: application
home: https://github.com/pensando/gpu-operator
sources:
  - https://github.com/pensando/gpu-operator
icon: https://raw.githubusercontent.com/ROCm/k8s-device-plugin/master/helm/logo.png
maintainers:
  - name: Yan Sun <Yan.Sun3@amd.com>
keywords:
  - kubernetes
  - cluster
  - hardware
  - gpu
  - amd

kubeVersion: ">= 1.29.0-0"
version: 0.0.1
appVersion: "0.0.1"

dependencies:
- name: nfd
  version: v0.1.0
  repository: "file://./charts/nfd"
  condition: nfd.enabled
- name: kmm
  version: v0.0.1
  repository: "file://./charts/kmm"
  condition: kmm.enabled
