apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "amd.com/v1alpha1",
          "kind": "DeviceConfig",
          "metadata": {
            "name": "test-device-config",
            "namespace": "kube-amd-gpu"
          },
          "spec": {
            "devicePluginImage": "rocm/k8s-device-plugin:latest",
            "driversImage": "my.registry.io/myUserName/myRepo",
            "driversVersion": "6.1.3",
            "imageRepoSecret": {
              "name": "mySecret"
            },
            "nodeLabellerImage": "rocm/k8s-device-plugin:labeller-latest",
            "selector": {
              "feature.node.kubernetes.io/amd-gpu": "true"
            }
          }
        }
      ]
    capabilities: Basic Install
    createdAt: "2024-10-05T04:39:54Z"
    operatorframework.io/suggested-namespace: kube-amd-gpu
    operators.operatorframework.io/builder: operator-sdk-v1.32.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v3
    repository: https://github.com/pensando/gpu-operator
  name: amd-gpu-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: DeviceConfig describes how to enable AMD GPU device
      displayName: DeviceConfig
      kind: DeviceConfig
      name: deviceconfigs.amd.com
      resources:
      - kind: Daemonset
        name: apps
        version: v1
      - kind: services
        name: core
        version: v1
      - kind: Module
        name: modules.kmm.sigs.x-k8s.io
        version: v1beta1
      specDescriptors:
      - description: blacklist amdgpu drivers on the host
        displayName: BlacklistDrivers
        path: blacklistDrivers
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:blacklistDrivers
      - description: device plugin image
        displayName: DevicePluginImage
        path: devicePluginImage
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:devicePluginImage
      - description: defines image that includes drivers and firmware blobs, don't
          include tag since it will be fully managed by operator for vanilla k8s the
          default value is image-registry:5000/$MOD_NAMESPACE/amdgpu_kmod for OpenShift
          the default value is image-registry.openshift-image-registry.svc:5000/$MOD_NAMESPACE/amdgpu_kmod
          image tag will be in the format of <linux distro>-<release version>-<kernel
          version>-<driver version> example tag is coreos-416.94-5.14.0-427.28.1.el9_4.x86_64-el9-6.1.1
          and ubuntu-22.04-5.15.0-94-generic-6.1.3
        displayName: DriversImage
        path: driversImage
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:driversImage
      - description: driver image registry TLS setting for the container image
        displayName: DriversImageRegistryTLS
        path: driversImageRegistryTLS
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:driversImageRegistryTLS
      - description: If true, check if the container image already exists using plain
          HTTP.
        displayName: Insecure
        path: driversImageRegistryTLS.insecure
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:insecure
      - description: If true, skip any TLS server certificate validation
        displayName: InsecureSkipTLSVerify
        path: driversImageRegistryTLS.insecureSkipTLSVerify
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:insecureSkipTLSVerify
      - description: 'version of the drivers source code, can be used as part of image
          of dockerfile source image default value for different OS is: ubuntu: 6.1.3,
          coreOS: el9-6.1.1'
        displayName: DriversVersion
        path: driversVersion
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:driversVersion
      - description: pull secrets used for pull/push images from/to private registry
          specified in driversImage
        displayName: ImageRepoSecret
        path: imageRepoSecret
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:imageRepoSecret
      - description: ImageSignCertSecret the public key used to sign kernel modules
          within image necessary for secire boot enabled system
        displayName: ImageSignCertSecret
        path: imageSignCertSecret
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:imageSignCertSecret
      - description: ImageSignKeySecret the private key used to sign kernel modules
          within image necessary for secire boot enabled system
        displayName: ImageSignKeySecret
        path: imageSignKeySecret
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:imageSignKeySecret
      - description: metrics exporter
        displayName: MetricsExporter
        path: metricsExporter
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:metricsExporter
      - description: optional configuration for metrics
        displayName: Config
        path: metricsExporter.config
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:config
      - description: Name of the configMap that defines the list of metrics default
          list:[]
        displayName: Name
        path: metricsExporter.config.name
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:name
      - description: enable metrics exporter, disabled by default
        displayName: Enable
        path: metricsExporter.enable
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:enable
      - description: metrics exporter image
        displayName: Image
        path: metricsExporter.image
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:image
      - description: metrics tcp port in the range 30000-32767, assigned automatically
          by default
        displayName: NodePort
        path: metricsExporter.nodePort
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:nodePort
      - description: service port exposed by metrics-exporter, default 5000
        displayName: Port
        path: metricsExporter.port
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:port
      - description: Selector describes on which nodes to enable metrics exporter
        displayName: Selector
        path: metricsExporter.selector
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:selector
      - description: ServiceType service type for metrics, clusterIP/NodePort, clusterIP
          by default
        displayName: ServiceType
        path: metricsExporter.serviceType
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:serviceType
      - description: node labeller image
        displayName: NodeLabellerImage
        path: nodeLabellerImage
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:nodeLabellerImage
      - description: RedhatSubscriptionPassword is the password for redhat subscription
          manager.
        displayName: RedhatSubscriptionPassword
        path: redhatSubscriptionPassword
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:redhatSubscriptionPassword
      - description: RedhatSubscriptionUsername is the username for redhat subscription
          manager.
        displayName: RedhatSubscriptionUsername
        path: redhatSubscriptionUsername
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:redhatSubscriptionUsername
      - description: repo URL, https://repo.radeon.com/amdgpu-install by default
        displayName: RepoURL
        path: repoURL
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:repoURL
      - description: Selector describes on which nodes the GPU Operator should enable
          the GPU device.
        displayName: Selector
        path: selector
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:selector
      - description: skip driver install/uninstall
        displayName: SkipDrivers
        path: skipDrivers
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:skipDrivers
      - description: if the in-tree driver should be used instead of OOT drivers
        displayName: UseInTreeDrivers
        path: useInTreeDrivers
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:useInTreeDrivers
      statusDescriptors:
      - description: number of the actually deployed and running pods
        displayName: AvailableNumber
        path: devicePlugin.availableNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:availableNumber
      - description: number of the pods that should be deployed for daemonset
        displayName: DesiredNumber
        path: devicePlugin.desiredNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:desiredNumber
      - description: number of nodes that are targeted by the DeviceConfig selector
        displayName: NodesMatchingSelectorNumber
        path: devicePlugin.nodesMatchingSelectorNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:nodesMatchingSelectorNumber
      - description: number of the actually deployed and running pods
        displayName: AvailableNumber
        path: driver.availableNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:availableNumber
      - description: number of the pods that should be deployed for daemonset
        displayName: DesiredNumber
        path: driver.desiredNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:desiredNumber
      - description: number of nodes that are targeted by the DeviceConfig selector
        displayName: NodesMatchingSelectorNumber
        path: driver.nodesMatchingSelectorNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:nodesMatchingSelectorNumber
      - description: number of the actually deployed and running pods
        displayName: AvailableNumber
        path: metricsExporter.availableNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:availableNumber
      - description: number of the pods that should be deployed for daemonset
        displayName: DesiredNumber
        path: metricsExporter.desiredNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:desiredNumber
      - description: number of nodes that are targeted by the DeviceConfig selector
        displayName: NodesMatchingSelectorNumber
        path: metricsExporter.nodesMatchingSelectorNumber
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:nodesMatchingSelectorNumber
      - description: NodeModuleStatus contains per node status of driver module installation
        displayName: NodeModuleStatus
        path: nodeModuleStatus
        x-descriptors:
        - urn:alm:descriptor:com.amd.deviceconfigs:nodeModuleStatus
      version: v1alpha1
  description: |-
    Operator responsible for deploying AMD GPU kernel drivers and device plugin
    For more information, visit [documentation](https://github.com/pensando/gpu-operator/blob/main/README.md)
  displayName: amd-gpu-operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - amd.com
          resources:
          - deviceconfigs
          verbs:
          - create
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - amd.com
          resources:
          - deviceconfigs/finalizers
          verbs:
          - update
        - apiGroups:
          - amd.com
          resources:
          - deviceconfigs/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - apps
          resources:
          - daemonsets
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - apps
          resources:
          - daemonsets/finalizers
          verbs:
          - create
          - get
          - update
          - watch
        - apiGroups:
          - apps
          resources:
          - daemonsets/status
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - ""
          resources:
          - nodes
          verbs:
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - ""
          resources:
          - nodes/finalizers
          verbs:
          - get
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - nodes/status
          verbs:
          - get
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - services
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - ""
          resources:
          - services/finalizers
          verbs:
          - create
          - get
          - update
          - watch
        - apiGroups:
          - kmm.sigs.x-k8s.io
          resources:
          - modules
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - kmm.sigs.x-k8s.io
          resources:
          - modules/finalizers
          verbs:
          - get
          - update
          - watch
        - apiGroups:
          - kmm.sigs.x-k8s.io
          resources:
          - modules/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - kmm.sigs.x-k8s.io
          resources:
          - nodemodulesconfigs
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - kmm.sigs.x-k8s.io
          resources:
          - nodemodulesconfigs/finalizers
          verbs:
          - get
          - update
          - watch
        - apiGroups:
          - kmm.sigs.x-k8s.io
          resources:
          - nodemodulesconfigs/status
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - nfd.openshift.io
          resources:
          - nodefeaturediscoveries
          verbs:
          - delete
          - get
          - list
        - apiGroups:
          - nfd.openshift.io
          resources:
          - nodefeaturediscoveries/finalizers
          verbs:
          - get
          - update
        - apiGroups:
          - nfd.openshift.io
          resources:
          - nodefeaturediscoveries/status
          verbs:
          - get
          - update
        serviceAccountName: amd-gpu-operator-controller-manager
      - rules:
        - apiGroups:
          - ""
          resources:
          - nodes
          verbs:
          - watch
          - get
          - list
          - update
        - apiGroups:
          - security.openshift.io
          resourceNames:
          - privileged
          resources:
          - securitycontextconstraints
          verbs:
          - use
        serviceAccountName: amd-gpu-operator-node-labeller
      deployments:
      - label:
          app.kubernetes.io/component: amd-gpu
          app.kubernetes.io/name: amd-gpu
          app.kubernetes.io/part-of: amd-gpu
          control-plane: controller-manager
        name: amd-gpu-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/component: amd-gpu
              app.kubernetes.io/name: amd-gpu
              app.kubernetes.io/part-of: amd-gpu
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/component: amd-gpu
                app.kubernetes.io/name: amd-gpu
                app.kubernetes.io/part-of: amd-gpu
                control-plane: controller-manager
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
                    - matchExpressions:
                      - key: node-role.kubernetes.io/master
                        operator: Exists
              containers:
              - args:
                - --config=controller_manager_config.yaml
                env:
                - name: OPERATOR_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                image: registry.test.pensando.io:5000/amd-gpu-operator:dev
                imagePullPolicy: Always
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 384Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                volumeMounts:
                - mountPath: /controller_manager_config.yaml
                  name: manager-config
                  subPath: controller_manager_config.yaml
              securityContext:
                runAsNonRoot: true
              serviceAccountName: amd-gpu-operator-controller-manager
              terminationGracePeriodSeconds: 10
              tolerations:
              - effect: NoSchedule
                key: node-role.kubernetes.io/master
                operator: Equal
              - effect: NoSchedule
                key: node-role.kubernetes.io/control-plane
                operator: Equal
              volumes:
              - configMap:
                  name: amd-gpu-operator-manager-config
                name: manager-config
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        serviceAccountName: amd-gpu-operator-controller-manager
      - rules:
        - apiGroups:
          - security.openshift.io
          resourceNames:
          - privileged
          resources:
          - securitycontextconstraints
          verbs:
          - use
        serviceAccountName: amd-gpu-operator-kmm-device-plugin
      - rules:
        - apiGroups:
          - security.openshift.io
          resourceNames:
          - privileged
          resources:
          - securitycontextconstraints
          verbs:
          - use
        serviceAccountName: amd-gpu-operator-kmm-module-loader
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - amd-gpu-operator
  links:
  - name: Amd Gpu Operator
    url: https://amd-gpu-operator.domain
  maturity: alpha
  provider:
    name: amd-gpu-operator
  version: 0.0.1
