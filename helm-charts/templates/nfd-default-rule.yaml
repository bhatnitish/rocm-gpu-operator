{{- if .Values.installdefaultNFDRule }}
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: amd-gpu-label-nfd-rule
spec:
  rules:
  - name: amd-gpu
    labels:
      "feature.node.kubernetes.io/amd-gpu": "true"
    matchFeatures:
    - feature: pci.device
      matchExpressions:
        vendor:
          op: In
          value: ["1002"] # AMD vendor ID
{{- end }}