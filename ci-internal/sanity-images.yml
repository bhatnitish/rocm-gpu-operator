---

images:
    meta:
        registry:
            default: docker.io
            mirror:
                enable: yes
                url: registry.test.pensando.io:5000
        packaging:
          gpuctl : disabled
    k8:
        driver:
          key           : driver.image
          kind          : container

        gpu-operator:
            image       : /gpu-operator/build/charts/internal-gpu-operator-helm-k8s-v1.4.0.tgz
            kind        : helm-chart
            version     : v1.4.0

        gpu-controller-manager:
            key         : controllerManager.manager.image
            image       : /gpu-operator/amd-gpu-operator-latest.tar.gz
            kind        : container

        exporter:
            image       : /device-metrics-exporter/helm-charts/device-metrics-exporter-charts.tgz
            kind        : helm-chart
            version     : v1.4.1

        device-metrics-exporter:
            key         : metricsExporter.image
            image       : /device-metrics-exporter/docker/device-metrics-exporter-latest.tar.gz
            kind        : container

        test-runner:
            key         : testRunner.image
            image       : /device-metrics-exporter/docker/testrunner/test-runner-latest.tar.gz
            kind        : container

        test-runner-agfhc:
            key         : testRunnerAgfhc.image
            image       : /device-metrics-exporter/docker/testrunner/test-runner-latest-agfhc.tar.gz
            kind        : container

        config-manager:
            key         : configManager.image
            image       : /device-config-manager/docker/obj/device-config-manager.tgz
            kind        : container

        device-plugin:
            key         : devicePlugin.devicePluginImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : latest
            kind        : container

        node-labeller:
            key         : devicePlugin.nodeLabellerImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : labeller-latest
            kind        : container

        kmm-controller-manager-image-sign:
            key         : kmm.controller.manager.env.relatedImageSign
            image       : /kernel-module-management/kernel-module-management-signimage.tar.gz
            kind        : container

        kmm-controller-manager-worker:
            key         : kmm.controller.manager.env.relatedImageWorker
            image       : /kernel-module-management/kernel-module-management-worker.tar.gz
            kind        : container

        kmm-controller-manager:
            key         : kmm.controller.manager.image
            image       : /kernel-module-management/kernel-module-management-operator.tar.gz
            kind        : container

        kmm-webhook-server:
            key         : kmm.webhookServer.webhookServer.image
            image       : /kernel-module-management/kernel-module-management-webhook-server.tar.gz
            kind        : container

        init-container-image:
            key         : commonConfig.initContainerImage
            location    : container://<registry>/busybox
            version     : 1.36
            kind        : container

        tensorflow-image:
            key         : workload.tensorflow
            location    : container://registry.test.pensando.io:5000/rocm/tensorflow
            version     : latest
            kind        : container

        pytorch-image:
            key         : workload.pytorch
            location    : container://docker.io/rocm/pytorch
            version     : latest
            kind        : container

    standalone:
        driver:
          key           : driver.image
          kind          : container

        gpu-operator:
            image       : /gpu-operator/build/charts/internal-gpu-operator-helm-k8s-v1.4.0.tgz
            kind        : helm-chart
            version     : v1.4.0

        gpu-controller-manager:
            key         : controllerManager.manager.image
            image       : /gpu-operator/amd-gpu-operator-latest.tar.gz
            kind        : container

        exporter-debian-Ubuntu-22.04:
            image       : /device-metrics-exporter/bin/amdgpu-exporter_22.04_amd64.deb
            kind        : debian
            version     : main

        exporter-debian-Ubuntu-24.04:
            image       : /device-metrics-exporter/bin/amdgpu-exporter_24.04_amd64.deb
            kind        : debian
            version     : main

        device-metrics-exporter:
            key         : metricsExporter.image
            image       : /device-metrics-exporter/docker/device-metrics-exporter-latest.tar.gz
            kind        : container

        device-plugin:
            key         : devicePlugin.devicePluginImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : latest
            kind        : container

        kmm-controller-manager-image-sign:
            key         : kmm.controller.manager.env.relatedImageSign
            image       : /kernel-module-management/kernel-module-management-signimage.tar.gz
            kind        : container

        kmm-controller-manager-worker:
            key         : kmm.controller.manager.env.relatedImageWorker
            image       : /kernel-module-management/kernel-module-management-worker.tar.gz
            kind        : container

        kmm-controller-manager:
            key         : kmm.controller.manager.image
            image       : /kernel-module-management/kernel-module-management-operator.tar.gz
            kind        : container

        kmm-webhook-server:
            key         : kmm.webhookServer.webhookServer.image
            image       : /kernel-module-management/kernel-module-management-webhook-server.tar.gz
            kind        : container

        init-container-image:
            key         : commonConfig.initContainerImage
            location    : container://<registry>/busybox
            version     : 1.36
            kind        : container

