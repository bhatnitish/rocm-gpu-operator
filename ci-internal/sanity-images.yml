---

images:
    meta:
        registry:
            default: docker.io
            mirror:
                enable: yes
                url: registry.test.pensando.io:5000
    k8:
        gpu-operator:
            image       : /gpu-operator/helm-charts-k8s/gpu-operator-helm-k8s-v1.2.0.tgz
            kind        : helm-chart

        gpu-controller-manager:
            key         : controllerManager.manager.image
            image       : /gpu-operator/amd-gpu-operator-latest.tar.gz
            kind        : container

        device-metrics-exporter:
            key         : metricsExporter.image
            image       : /device-metrics-exporter/docker/device-metrics-exporter-latest.tar.gz
            kind        : container

        test-runner:
            key         : testRunner.image
            image       : /device-metrics-exporter/docker/testrunner/test-runner-latest.tar.gz
            kind        : container
        
        device-plugin:
            key         : devicePlugin.devicePluginImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : latest
            kind        : container

        node-labeller:
            key         : devicePlugin.nodeLabellerImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : labeller-latest
            kind        : container

        kmm-controller-manager-image-sign:
            key         : kmm.controller.manager.env.relatedImageSign
            location    : container://<registry>/rocm/kernel-module-management-signimage
            version     : latest
            kind        : container

        kmm-controller-manager-worker:
            key         : kmm.controller.manager.env.relatedImageWorker
            location    : container://<registry>/rocm/kernel-module-management-worker
            version     : latest
            kind        : container

        kmm-controller-manager:
            key         : kmm.controller.manager.image
            image       : /kernel-module-management/kernel-module-management-operator.tar.gz
            version     : latest
            kind        : container

        kmm-webhook-server:
            key         : kmm.webhookServer.webhookServer.image
            location    : container://<registry>/rocm/kernel-module-management-webhook-server
            version     : latest
            kind        : container

